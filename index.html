<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lead Finder</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f5f7fb;color:#111827;padding:20px}
.container{max-width:800px;margin:auto}
.header{background:#111827;color:white;padding:25px;border-radius:16px;margin-bottom:20px}
.header h1{margin:0 0 8px;font-size:30px}
.header p{margin:0;color:#d1d5db}
.box{background:white;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:bold;margin:12px 0 7px}
input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:10px;background:#111827;color:white;font-size:17px;font-weight:bold}
.result{border:1px solid #e5e7eb;padding:15px;border-radius:12px;margin-top:12px}
.result h3{margin:0 0 8px}
.result p{margin:6px 0;color:#4b5563}
.demo{margin-top:18px;padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:14px}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>🔎 Lead Finder</h1>
<p>Find business leads by area and category</p>
</div>

<div class="box">
<label>📍 Area</label>
<input id="area" placeholder="Example: Nandura">

<label>🏪 Business Category</label>
<input id="category" placeholder="Example: Electrical Shops">

<button onclick="searchLeads()">🔍 SEARCH LEADS</button>
</div>

<div class="box" id="results">
<h2>Leads</h2>
<p>Enter Area and Category to search.</p>
</div>

</div>

<script>
function searchLeads(){
const area=document.getElementById("area").value.trim();
const category=document.getElementById("category").value.trim();

if(!area||!category){
alert("Please enter Area and Category.");
return;
}

document.getElementById("results").innerHTML=`
<h2>Leads Found</h2>

<div class="result">
<h3>Demo Electrical Store</h3>
<p>📍 ${area}</p>
<p>🏪 ${category}</p>
<p>📞 Public Contact</p>
<p>🗺️ Google Maps</p>
</div>

<div class="result">
<h3>Demo Light House</h3>
<p>📍 ${area}</p>
<p>🏪 ${category}</p>
<p>📞 Public Contact</p>
<p>🗺️ Google Maps</p>
</div>

<div class="result">
<h3>Demo Power Center</h3>
<p>📍 ${area}</p>
<p>🏪 ${category}</p>
<p>📞 Public Contact</p>
<p>🗺️ Google Maps</p>
</div>

<div class="demo">
⚠️ DEMO MODE: Ye sample data hai. Baad mein real business data connect kiya jayega.
</div>`;
}
</script>

</body>
</html>
